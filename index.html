<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Protein AR Viewer - Table of Contents</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- model-viewer for inline previews (AR disabled here) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color:#111; }
    h1 { text-align: center; margin: 0 0 18px; }
    .model-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .model-card {
      width: 250px; text-align: center; border: 1px solid #ccc; border-radius: 8px;
      padding: 10px; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      display: flex; flex-direction: column;
    }
    model-viewer.preview {
      display: block; width: 100%; height: 200px; background-color:#fff;
      position: relative; z-index: 0;
    }
    .model-card h3 { margin: 8px 0 4px; font-size: 16px; }
    .model-card a { text-decoration: none; color: #007bff; font-size: 14px; }
    .model-card a:hover { text-decoration: underline; }

    /* Hide any AR button in the small previews (belt + suspenders) */
    model-viewer.preview::part(ar-button) { display: none !important; }
  </style>
</head>
<body>

  <h1>Protein AR Viewer - Table of Contents</h1>

  <div class="model-grid">

    <!-- Card: Src SH2 Domain (1SPR): Secondary Structures -->
    <div class="model-card">
      <model-viewer class="preview"
        src="models/1SPR_2Structure.glb"
        alt="Src SH2 Domain (1SPR): Secondary Structures"
        camera-controls
        auto-rotate
        poster="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
      </model-viewer>
      <h3>Src SH2 Domain (1SPR): Secondary Structures</h3>
      <a href="pages/viewer.html?title=Model%201&glb=../models/1SPR_2Structure.glb&usdz=../models/1SPR_2Structure.usdz">
        View in Fullscreen &amp; AR
      </a>
    </div>

    <!-- Card: EcoRI Recognition of DNA (1ERI) -->
    <div class="model-card">
      <model-viewer class="preview"
        src="models/1ERI.glb"
        alt="EcoRI Recognition of DNA (1ERI)"
        camera-controls
        auto-rotate
        poster="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
      </model-viewer>
      <h3>EcoRI Recognition of DNA (1ERI)</h3>
      <a href="pages/viewer.html?title=Model%202&glb=../models/1ERI.glb&usdz=../models/1ERI.usdz">
        View in Fullscreen &amp; AR
      </a>
    </div>

    <!-- Card: gp120 binding to CCR5 (6MEO) -->
    <div class="model-card">
      <model-viewer class="preview"
        src="models/6MEO.glb"
        alt="gp120 binding to CCR5 (6MEO)"
        camera-controls
        auto-rotate
        poster="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
      </model-viewer>
      <h3>gp120 binding to CCR5 (6MEO)</h3>
      <a href="pages/viewer.html?title=Model%203&glb=../models/6MEO.glb&usdz=../models/6MEO.usdz">
        View in Fullscreen &amp; AR
      </a>
    </div>

    <!-- Card: Maraviroc bound to CCR5 (4MBS) -->
    <div class="model-card">
      <model-viewer class="preview"
        src="models/4MBS.glb"
        alt="Maraviroc bound to CCR5 (4MBS)"
        camera-controls
        auto-rotate
        poster="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
      </model-viewer>
      <h3>Maraviroc bound to CCR5 (4MBS)</h3>
      <a href="pages/viewer.html?title=Model%204&glb=../models/4MBS.glb&usdz=../models/4MBS.usdz">
        View in Fullscreen &amp; AR
      </a>
    </div>

  </div>

</body>
</html>
