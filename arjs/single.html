<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>AR.js Single Marker (HIRO) — Protein</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    .hud{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;
         color:#fff;font:14px/1.4 system-ui,Arial;background:rgba(0,0,0,.35)}
    .hud b{color:#7ff}
    .warn{position:fixed;top:8px;left:8px;right:8px;color:#fff;background:#c33;padding:8px;display:none}
    .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
          background:#000;z-index:99}
    .gate button{font:600 16px/1.2 system-ui,Arial;padding:14px 18px;border-radius:10px;border:0;background:#0a84ff;color:#fff}
  </style>
</head>
<body>
  <div id="warn" class="warn">Camera permission blocked or model failed to load. Check Chrome → Site settings → Camera.</div>

  <!-- Tap-to-start overlay to force the camera permission prompt -->
  <div class="gate" id="gate">
    <button id="startBtn">Tap to enable camera</button>
  </div>

  <a-scene
    embedded
    renderer="logarithmicDepthBuffer:true;antialias:true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false"
    loading-screen="enabled: false"
    id="scene">
    <!-- HIRO marker (no .patt needed) -->
    <a-marker preset="hiro" emitevents="true" id="marker">
      <a-entity id="model"
        gltf-model="url(../models/4INS.glb)"  <!-- replaced via ?glb=... -->
        scale="0.25 0.25 0.25"
        rotation="0 0 0"
        visible="false">
      </a-entity>
      <!-- Fallback geometry if model fails -->
      <a-box id="fallback" position="0 0.5 0" depth="1" height="1" width="1" color="#39f" visible="false"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <div class="hud">
    <b>Tips:</b> Use a printed HIRO marker. Good, even lighting. If you see a blue box, your GLB path is wrong.
  </div>

  <script>
    // Accept ?glb=... to override default model
    const p = new URLSearchParams(location.search);
    const glb = p.get('glb');
    if (glb) document.getElementById('model').setAttribute('gltf-model', `url(${glb})`);

    // Show model when marker found; show fallback if the model fails to load
    const marker = document.getElementById('marker');
    const modelEl = document.getElementById('model');
    const warnEl  = document.getElementById('warn');
    marker.addEventListener('markerFound', () => modelEl.setAttribute('visible','true'));
    modelEl.addEventListener('model-error', () => {
      document.getElementById('fallback').setAttribute('visible','true');
      warnEl.style.display = 'block';
      warnEl.textContent = 'Model failed to load. Check your GLB URL.';
    });

    // Tap-to-start: proactively request camera permission
    const gate = document.getElementById('gate');
    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        // Stop preflight stream; AR.js will start its own
        (stream.getTracks()||[]).forEach(t => t.stop());
        gate.style.display = 'none';
        // Nudge the scene layout (sometimes helps AR.js source sizing)
        setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
      } catch (e) {
        warnEl.style.display = 'block';
        warnEl.textContent = 'Camera permission denied or unavailable. Allow camera in site settings and reload.';
      }
    });

    // If camera never starts, show a gentle warning after a few seconds
    setTimeout(() => {
      const video = document.querySelector('video');
      if (!video || (video.readyState || 0) < 2) warnEl.style.display = 'block';
    }, 5000);
  </script>
</body>
</html>
