<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR.js Camera Test (A-Frame 1.2.0)</title>
<!-- Pin to versions that are known to work together -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#0f0;font:14px/1.4 ui-monospace,Consolas,monospace}
  #log{position:fixed;left:0;right:0;top:0;max-height:44%;overflow:auto;white-space:pre-wrap;
       background:rgba(0,0,0,.6);padding:8px;z-index:100}
</style>
<body>
<div id="log"></div>

<!-- No preflight, no extras: just AR.js requesting the camera itself -->
<a-scene
  embedded
  renderer="alpha:true; antialias:true"
  arjs="sourceType: webcam; facingMode: environment; trackingMethod: best; videoTexture: true; debugUIEnabled: false"
  loading-screen="enabled:false"
  id="scene">
  <a-entity camera></a-entity>
</a-scene>

<script>
  const log = (...a)=>{document.getElementById('log').textContent += a.join(' ') + '\n';};
  log('A-Frame:', AFRAME.version);

  const scene = document.getElementById('scene');
  scene.addEventListener('camera-init',  e=>log('camera-init:',  JSON.stringify(e.detail||{})));
  scene.addEventListener('camera-error', e=>log('camera-error:', e && e.detail ? e.detail : 'unknown'));
  // Report basic video status after startup
  setTimeout(()=>{
    const v = document.querySelector('video');
    log('video present:', !!v, 'readyState:', v && v.readyState);
  }, 1500);
</script>
</body>
</html>
