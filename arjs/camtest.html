<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>AR.js Camera Test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:99}
    .gate button{font:600 16px system-ui,Arial;padding:14px 18px;border-radius:10px;border:0;background:#0a84ff;color:#fff}
    .warn{position:fixed;top:8px;left:8px;right:8px;color:#fff;background:#c33;padding:8px;display:none}
  </style>
</head>
<body>
  <div id="warn" class="warn">No camera. In Chrome: lock icon → Site settings → Camera → Allow.</div>
  <div class="gate" id="gate"><button id="startBtn">Tap to enable camera</button></div>

  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false"
           loading-screen="enabled:false" id="scene">
    <!-- no markers/models; just start the camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const warn = document.getElementById('warn');
    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
        (s.getTracks()||[]).forEach(t=>t.stop());
        document.getElementById('gate').style.display='none';
        setTimeout(()=>window.dispatchEvent(new Event('resize')),100);
      } catch(e) {
        warn.style.display='block';
      }
    });
    setTimeout(()=>{
      const v = document.querySelector('video');
      if (!v || (v.readyState||0) < 2) warn.style.display='block';
    }, 5000);
  </script>
</body>
</html>
