<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR.js HIRO Cube (robust)</title>
<!-- Known-good versions -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#0f0;font:14px ui-monospace,Consolas,monospace}
  #log{position:fixed;left:0;right:0;top:0;max-height:44%;overflow:auto;white-space:pre-wrap;background:rgba(0,0,0,.6);padding:8px;z-index:100}
  /* Hide VR/AR chrome */
  .a-enter-vr-button, .a-enter-ar-button { display:none !important; }
</style>
<body>
<div id="log"></div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="alpha:true; antialias:true"
  arjs="
    sourceType: webcam;
    facingMode: environment;
    trackingMethod: best;
    videoTexture: true;
    debugUIEnabled: false;
    detectionMode: mono;
    patternRatio: 0.90;
    sourceWidth: 640; sourceHeight: 480;
    displayWidth: 1280; displayHeight: 960
  "
  loading-screen="enabled:false"
  id="scene">

  <!-- Use the pattern file directly instead of preset -->
  <a-marker type="pattern"
            url="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/three.js/examples/marker-training/examples/pattern-files/pattern-hiro.patt"
            emitevents="true" id="marker">
    <a-box color="#39f" position="0 0.5 0" depth="1" height="1" width="1"></a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const log = (...a)=>{document.getElementById('log').textContent += a.join(' ') + '\n';};
  log('A-Frame:', AFRAME.version);
  const scene = document.getElementById('scene');
  scene.addEventListener('camera-init',  e=>log('camera-init:',  JSON.stringify(e.detail||{})));
  scene.addEventListener('camera-error', e=>log('camera-error:', e && e.detail ? e.detail : 'unknown'));
  document.getElementById('marker').addEventListener('markerFound', ()=>log('markerFound'));
  setTimeout(()=>{ const v=document.querySelector('video'); log('video present:',!!v,'readyState:',v&&v.readyState); }, 1200);
</script>
</body>
</html>
