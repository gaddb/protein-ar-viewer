<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Plain Camera Test</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font:16px system-ui,Arial}
    .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
    button{font:600 16px system-ui,Arial;padding:14px 18px;border-radius:10px;border:0;background:#0a84ff;color:#fff}
    #msg{position:fixed;top:8px;left:8px;right:8px;background:#c33;padding:8px;display:none}
    video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  </style>
</head>
<body>
  <div id="msg"></div>
  <div class="gate"><button id="start">Tap to enable camera</button></div>
  <video id="v" autoplay playsinline muted></video>

  <script>
    const btn = document.getElementById('start');
    const gate = btn.parentElement;
    const v = document.getElementById('v');
    const msg = document.getElementById('msg');

    btn.onclick = async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          msg.textContent = 'getUserMedia not available on this browser.';
          msg.style.display = 'block';
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        v.srcObject = stream;
        gate.style.display = 'none';
      } catch (e) {
        msg.textContent = 'Camera blocked or unavailable. Allow camera for this site, then reload.';
        msg.style.display = 'block';
      }
    };
  </script>
</body>
</html>
