<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Protein AR Viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html,body { height:100%; margin:0; background:#fff; color:#000; font-family:Arial, sans-serif; }
    header {
      position:fixed; top:0; left:0; right:0; padding:10px 14px;
      background:rgba(255,255,255,.9); z-index:2; display:flex; align-items:center; gap:12px;
      border-bottom:1px solid #e5e5e5;
    }
    header h1 { font-size:16px; margin:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    header a { color:#0a66c2; text-decoration:none; }
    model-viewer { width:100%; height:100%; background-color:#fff; }
    .note { position:fixed; bottom:8px; left:8px; right:8px; z-index:2; font-size:12px; opacity:.85; color:#333; }
    .ar-btn {
      position:fixed; right:14px; bottom:14px; z-index:3;
      border:0; padding:10px 14px; border-radius:8px; background:#0a84ff; color:#fff; font-weight:600;
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" aria-label="Back">← Back</a>
    <h1 id="title">Protein AR Viewer</h1>
  </header>

  <model-viewer id="mv"
    src=""
    ios-src=""
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    quick-look-browsers="safari chrome"
    ar-placement="floor"
    ar-scale="auto"
    bounds="tight"
    exposure="1"
    shadow-intensity="0.2">
    <button slot="ar-button" class="ar-btn">View in AR</button>
  </model-viewer>

  <div id="note" class="note"></div>

  <script>
    // Parse query params: ?title=...&glb=...&usdz=...
    const p = new URLSearchParams(location.search);
    const title = p.get('title') || '';
    const glb = p.get('glb');
    const usdz = p.get('usdz') || '';

    if (title) document.getElementById('title').textContent = title;

    const mv = document.getElementById('mv');
    const noteEl = document.getElementById('note');

    if (!glb) {
      noteEl.textContent = 'Missing ?glb= path in URL.';
    } else {
      mv.src = glb;                 // e.g., ../models/4INS.glb
      if (usdz) mv.setAttribute('ios-src', usdz);  // e.g., ../models/4INS.usdz
    }

    // Gentle guidance for iOS if no USDZ present
    const isIOS =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS && !usdz) {
      noteEl.textContent = 'iOS AR requires a USDZ. Add &usdz=../models/YourModel.usdz to enable “View in AR”.';
    }
  </script>
</body>
</html>
