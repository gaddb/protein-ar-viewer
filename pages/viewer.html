<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Protein AR Viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root { --header-h: 48px; }
    html, body { height: 100%; margin: 0; background: #fff; color: #000; font-family: Arial, sans-serif; }
    body { padding-top: var(--header-h); }
    header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      background: rgba(255,255,255,.95); border-bottom: 1px solid #e5e5e5; z-index: 3;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header a { color: #0a66c2; text-decoration: none; }

    model-viewer {
      width: 100%;
      height: calc(100vh - var(--header-h));
      background-color: #fff;
      touch-action: none; /* smoother touch interactions */
    }

    /* Buttons / notes that overlay the canvas */
    .ar-btn {
      position: absolute; right: 14px; bottom: 14px; z-index: 4;
      border: 0; padding: 10px 14px; border-radius: 8px; font-weight: 600;
      background: #0a84ff; color: #fff;
    }
    .note {
      position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 2;
      font-size: 12px; opacity: .85; color: #333; text-align: left;
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" aria-label="Back">← Back</a>
    <h1 id="title">Protein AR Viewer</h1>
  </header>

  <model-viewer id="mv"
    src=""
    ios-src=""
    alt="3D molecular model"
    loading="eager"
    reveal="auto"

    camera-controls
    auto-rotate
    bounds="tight"
    environment-image="neutral"

    <!-- Nice wide range so you can zoom in close -->
    camera-orbit="0deg 65deg 130%"
    max-camera-orbit="auto auto 2500%"
    min-field-of-view="15deg"
    max-field-of-view="90deg"

    exposure="1"
    shadow-intensity="0.25"

    <!-- AR -->
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed">
    <button slot="ar-button" class="ar-btn">View in AR</button>
    <div id="note" class="note"></div>
  </model-viewer>

  <script>
    // Parse query params: ?title=...&glb=...&usdz=...
    const p = new URLSearchParams(location.search);
    const title = p.get('title') || '';
    const glb   = p.get('glb');          // e.g., ../models/4INS_plain.glb
    const usdz  = p.get('usdz') || '';   // e.g., ../models/4INS_plain.usdz

    if (title) document.getElementById('title').textContent = title;

    const mv = document.getElementById('mv');
    const noteEl = document.getElementById('note');

    if (!glb) {
      noteEl.textContent = 'Missing ?glb= path in URL.';
    } else {
      mv.src = glb;
      if (usdz) mv.setAttribute('ios-src', usdz);
    }

    // Helpful hint for iOS if USDZ is missing
    const isIOS =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS && !usdz) {
      noteEl.textContent = 'Tip: iOS Quick Look needs a USDZ. Add &usdz=../models/YourModel.usdz to enable “View in AR”.';
    }
  </script>
</body>
</html>
