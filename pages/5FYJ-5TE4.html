<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Model Viewer Test</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

   <model-viewer src="/protein-ar-viewer/models/5FYJ-5TE4.glb"
              ios-src="/protein-ar-viewer/models/5FYJ-5TE4.usdz"
              alt="5FYJ-5TE4 Protein Model"
              type="model/gltf-binary"
              ar
              ar-modes="scene-viewer quick-look webxr"
              ar-placement="floor"
              camera-controls
              auto-rotate
              shadow-intensity="1"
              style="width: 100%; height: 600px;">
    <div slot="poster">⚠️ Model failed to load.</div>
</model-viewer>

<script>
    const viewer = document.querySelector('model-viewer');
    
    viewer.addEventListener('load', () => {
        console.log('Model loaded successfully.');
    });

    viewer.addEventListener('error', (e) => {
        console.error('Model failed to load:', e);
    });
</script>



</body>
</html>
