<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Model in AR</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .ar-launch {
      display: none;
    }
    .ios-message {
      text-align: center;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const model = params.get('model');
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (!model) {
      document.body.innerHTML = "<p>Error: No model name provided in the URL.</p>";
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      // iOS: create an <a rel="ar"> and click it after interaction
      document.body.innerHTML = `
        <div class="ios-message">
          <p>Tap anywhere to view in AR</p>
        </div>
        <a id="ar-link" rel="ar" href="models/${model}.usdz" class="ar-launch">
          <img src="models/${model}.usdz" alt="AR" />
        </a>
      `;

      // Add a tap handler to trigger the AR experience
      document.body.addEventListener('click', () => {
        const link = document.getElementById('ar-link');
        if (link) link.click();
      });
    } else {
      // Android or other: launch Scene Viewer
      const glbUrl = `https://gaddb.github.io/protein-ar-viewer/models/${model}.glb`;
      const fallbackUrl = glbUrl;
      const sceneViewerUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glbUrl)}&mode=ar_preferred#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(fallbackUrl)};end;`;

      window.location.href = sceneViewerUrl;
    }
  </script>
</body>
</html>
