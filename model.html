<!DOCTYPE html>
<html lang="en">
<head>
    <title>AR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@1.11.0/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f0f0;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #ios-ar-link {
            display: none;
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <model-viewer id="ar-viewer"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        mime-type="model/gltf-binary">
    </model-viewer>

    <!-- Fallback button for iOS Chrome/Firefox -->
    <a id="ios-ar-link" href="#" rel="ar">View in AR</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const glb = params.get('glb');
        const usdz = params.get('usdz');
        const viewer = document.getElementById('ar-viewer');
        const iosLink = document.getElementById('ios-ar-link');

        if (glb && usdz) {
            viewer.src = `models/${glb}`;
            viewer.setAttribute('ios-src', `models/${usdz}`);
            iosLink.href = `models/${usdz}`;

            setTimeout(() => {
                console.log("Handling AR launch...");

                if (isIOS()) {
                    if (isSafari()) {
                        viewer.activateAR();  // ✅ Direct Quick Look for Safari
                    } else {
                        iosLink.style.display = 'block';  // ✅ Manual fallback for iOS Chrome
                    }
                } else if (isAndroid()) {
                    // ✅ Only trigger activateAR if Android and AR is supported
                    if (viewer.canActivateAR) {
                        viewer.activateAR();
                    } else {
                        console.warn('AR not supported on this Android device/browser');
                    }
                } else {
                    console.log('Neither iOS nor Android detected - showing normal 3D model only.');
                }
            }, 1000);
        } else {
            console.error('Missing glb or usdz parameters!');
        }

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function isSafari() {
            return /^((?!chrome|android).)*safari/i.test(navigator.userAgent) && !navigator.userAgent.includes('CriOS');
        }

        function isAndroid() {
            return /Android/.test(navigator.userAgent);
        }
    </script>
</body>
</html>
