<!DOCTYPE html>
<html lang="en">
<head>
    <title>AR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@1.11.0/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f0f0;
            overflow: hidden; /* Prevent scroll */
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <model-viewer id="ar-viewer"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        mime-type="model/gltf-binary"
        src="models/4INS.glb"     <!-- Use a file you KNOW worked before -->
        ios-src="models/4INS.usdz">  <!-- Same, matching file for iOS -->
    </model-viewer>
</body>
</html>
