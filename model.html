<!DOCTYPE html>
<html lang="en">
<head>
    <title>AR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@1.11.0/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f0f0;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #ios-ar-link {
            display: none;
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <model-viewer id="ar-viewer"
        ar  <!-- ✅ This was missing before! -->
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        mime-type="model/gltf-binary"
        src="models/4INS.glb"
        ios-src="models/4INS.usdz">
    </model-viewer>

    <!-- Manual iOS fallback button (only shown for Chrome on iOS) -->
    <a id="ios-ar-link" href="models/4INS.usdz" rel="ar">View in AR</a>

    <script>
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function isSafari() {
            return /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        }

        // Show manual AR link ONLY for iOS Chrome/Firefox (not Safari)
        if (isIOS() && !isSafari()) {
            document.getElementById('ios-ar-link').style.display = 'block';
        }
    </script>
</body>
</html>
