<!DOCTYPE html>
<html lang="en">
<head>
    <title>AR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@1.11.0/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f0f0;
            overflow: hidden; /* Prevent scroll */
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <model-viewer id="ar-viewer"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        mime-type="model/gltf-binary">
    </model-viewer>
    <script>
        const params = new URLSearchParams(window.location.search);
        const glb = params.get('glb');
        const usdz = params.get('usdz');
        const viewer = document.getElementById('ar-viewer');

        if (glb && usdz) {
            viewer.src = `models/${glb}`;
            viewer.setAttribute('ios-src', `models/${usdz}`);

            console.log('GLB file:', viewer.src);
            console.log('USDZ file:', viewer.getAttribute('ios-src'));

            setTimeout(() => {
                console.log("Finalized AR model loading... forcing AR now.");
                viewer.removeAttribute('ar'); // Refresh AR detection
                viewer.setAttribute('ar', '');
                viewer.activateAR(); // 🚀 Force AR immediately
            }, 1000); // Give it 1 second to fully load first
        } else {
            console.error('Missing glb or usdz parameters!');
        }
    </script>
</body>
</html>
