name: Upload AR Models

on:
  repository_dispatch:
    types: [upload_glb, upload_usdz]  # ✅ Now it listens for BOTH file types!

jobs:
  upload:
    runs-on: ubuntu-latest

    env:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Debug Payload  # ✅ Print incoming data to check if it's correct
        run: |
          echo "GLB Payload: ${{ github.event.client_payload.glb }}"
          echo "USDZ Payload: ${{ github.event.client_payload.usdz }}"
          echo "PDB ID: ${{ github.event.client_payload.pdbId }}"

      - name: Convert Base64 to File
        run: |
          mkdir -p models
          echo "${{ github.event.client_payload.glb }}" | base64 --decode > models/${{ github.event.client_payload.pdbId }}.glb
          echo "${{ github.event.client_payload.usdz }}" | base64 --decode > models/${{ github.event.client_payload.pdbId }}.usdz

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add models/
          git commit -m "Add model files for ${{ github.event.client_payload.pdbId }}"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/gaddb/protein-ar-viewer.git main
